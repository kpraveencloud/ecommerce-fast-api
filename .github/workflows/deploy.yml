name: Deploy to Cluster (CD)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: 'Image tag to deploy (e.g., latest, v1.0.0)'
        required: true
        default: 'latest'
        type: string
      image_name:
        description: 'Image name (leave empty to use secrets)'
        required: false
        default: ''
        type: string
      registry_url:
        description: 'Registry URL (leave empty to use secrets)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --zone ${{ secrets.GKE_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Verify deployment target
        run: |
          echo "🚀 Deploying to: ${{ github.event.inputs.environment }}"
          echo "Image tag: ${{ github.event.inputs.image_tag }}"
          kubectl config current-context
          kubectl get nodes

      - name: Update Helm repositories
        run: helm repo add ecommerce-repo ${{ secrets.GCP_REGISTRY_URL }} || true

      - name: Lint Helm chart
        run: helm lint ./helm

      - name: Deploy/Update Helm release
        run: |
          # Use provided registry/image or fall back to secrets
          REGISTRY="${{ github.event.inputs.registry_url || secrets.GCP_REGISTRY_URL }}"
          IMAGE_NAME="${{ github.event.inputs.image_name || secrets.DOCKER_IMAGE_NAME }}"

          # Set namespace and values based on environment
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            NAMESPACE="prod"
            VALUES="helm/values.yaml helm/values-prod.yaml"
            TIMEOUT="10m"
          else
            NAMESPACE="dev"
            VALUES="helm/values.yaml"
            TIMEOUT="5m"
          fi

          helm upgrade --install ecommerce-api ./helm \
            --namespace ${NAMESPACE} \
            --create-namespace \
            --values ${VALUES} \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --set image.repository=${REGISTRY}/${IMAGE_NAME} \
            --wait \
            --timeout ${TIMEOUT}

      - name: Verify deployment
        run: |
          NAMESPACE="${{ github.event.inputs.environment }}"

          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            TIMEOUT="10m"
          else
            TIMEOUT="5m"
          fi

          kubectl rollout status deployment/ecommerce-api -n ${NAMESPACE} --timeout=${TIMEOUT}
          kubectl get all -n ${NAMESPACE} -l app.kubernetes.io/name=ecommerce-api

      - name: Health check
        run: |
          NAMESPACE="${{ github.event.inputs.environment }}"

          echo "🏥 Running health checks on ${NAMESPACE}..."
          kubectl port-forward -n ${NAMESPACE} svc/ecommerce-api 8000:80 &
          sleep 5

          # Health probe
          curl -f http://localhost:8000/health || exit 1

          # Readiness probe (if prod, run full checks)
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            curl -f http://localhost:8000/ready || exit 1
            echo "✅ All health checks passed"
          else
            echo "✅ Health check passed"
          fi

      - name: Create deployment annotation
        if: github.event.inputs.environment == 'prod'
        run: |
          kubectl annotate deployment/ecommerce-api \
            -n prod \
            deployment.kubernetes.io/image-tag="${{ github.event.inputs.image_tag }}" \
            deployed-by="github-actions" \
            deployment-time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --overwrite

      - name: Notify deployment
        run: |
          echo "✅ Deployment to ${{ github.event.inputs.environment }} completed"
          echo "Image tag: ${{ github.event.inputs.image_tag }}"
          echo "Namespace: ${{ github.event.inputs.environment }}"
          echo "Status: kubectl rollout status deployment/ecommerce-api -n ${{ github.event.inputs.environment }}"
