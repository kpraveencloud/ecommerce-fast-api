name: Deploy to Cluster (CD)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: Existing image tag to deploy (for example, 1.0.0)
        required: true
        default: '1.0.0'
        type: string
      image_name:
        description: Image name; empty uses DOCKER_IMAGE_NAME
        required: false
        default: ''
        type: string
      registry_url:
        description: Registry path; empty uses GCP_REGISTRY_URL
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-ecommerce-mcp-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
      GKE_ZONE: ${{ secrets.GKE_ZONE }}
      NAMESPACE: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      REGISTRY: ${{ inputs.registry_url || secrets.GCP_REGISTRY_URL }}
      IMAGE_NAME: ${{ inputs.image_name || secrets.DOCKER_IMAGE_NAME }}
      RELEASE_NAME: ecommerce-mcp
      DEPLOYMENT_NAME: ecommerce-mcp
      SERVICE_NAME: ecommerce-mcp
      SERVICE_PORT: '80'
      CHART_PATH: ./helm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment settings
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in GitHub secrets}"
          : "${GKE_CLUSTER_NAME:?Set GKE_CLUSTER_NAME in GitHub secrets}"
          : "${REGISTRY:?Set GCP_REGISTRY_URL or registry_url}"
          : "${IMAGE_NAME:?Set DOCKER_IMAGE_NAME or image_name}"
          [[ "$NAMESPACE" == dev || "$NAMESPACE" == prod ]] || {
            echo "::error::Environment must be dev or prod"; exit 1;
          }
          REGISTRY="${REGISTRY%/}"
          if [[ ! "$REGISTRY" =~ ^[a-z0-9.-]+/[a-z0-9._/-]+$ ]]; then
            echo "::error::Use a registry/project/repository path without https://"
            exit 1
          fi
          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::Use a lowercase image name, such as ecommerce-mcp"
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag"
            exit 1
          fi
          test -f "$CHART_PATH/Chart.yaml"
          test -f "$CHART_PATH/values.yaml"
          DEPLOY_TIMEOUT=5m
          if [[ "$NAMESPACE" == prod ]]; then
            test -f "$CHART_PATH/values-prod.yaml"
            DEPLOY_TIMEOUT=10m
          fi
          {
            printf 'IMAGE_REPOSITORY=%s/%s\n' "$REGISTRY" "$IMAGE_NAME"
            printf 'DEPLOY_TIMEOUT=%s\n' "$DEPLOY_TIMEOUT"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK and GKE plugin
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Get GKE credentials
        run: |
          set -euo pipefail
          gke-gcloud-auth-plugin --version
          gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" \
            --zone="$GKE_ZONE" \
            --project="$GCP_PROJECT_ID"
          kubectl config current-context
          kubectl version --request-timeout=30s

      - name: Set up Helm
        uses: azure/setup-helm@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: latest

      - name: Create application secret
        env:
          APP_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          set -euo pipefail
          : "${APP_SECRET_KEY:?Add SECRET_KEY to the selected GitHub environment}"

          kubectl create secret generic ecommerce-mcp-secrets \
            --from-literal=SECRET_KEY="$APP_SECRET_KEY" \
            --namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Lint chart and deploy existing image
        run: |
          set -euo pipefail

          VALUES_ARGS=(--values "$CHART_PATH/values.yaml")
          if [[ "$NAMESPACE" == prod ]]; then
            VALUES_ARGS+=(--values "$CHART_PATH/values-prod.yaml")
          fi

          OVERRIDE_ARGS=(
            --set-string "image.repository=$IMAGE_REPOSITORY"
            --set-string "image.tag=$IMAGE_TAG"
          )

          helm lint "$CHART_PATH" \
            "${VALUES_ARGS[@]}" \
            "${OVERRIDE_ARGS[@]}"

          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            "${VALUES_ARGS[@]}" \
            "${OVERRIDE_ARGS[@]}" \
            --wait \
            --timeout "$DEPLOY_TIMEOUT"

      - name: Verify deployment
        run: |
          set -euo pipefail
          kubectl rollout status "deployment/$DEPLOYMENT_NAME" \
            --namespace "$NAMESPACE" --timeout="$DEPLOY_TIMEOUT"
          kubectl get deployment "$DEPLOYMENT_NAME" --namespace "$NAMESPACE"
          kubectl get service "$SERVICE_NAME" --namespace "$NAMESPACE"

      - name: Health checks
        run: |
          set -euo pipefail
          PF_LOG="$RUNNER_TEMP/ecommerce-mcp-port-forward.log"
          kubectl port-forward --namespace "$NAMESPACE" \
            "service/$SERVICE_NAME" "18000:$SERVICE_PORT" > "$PF_LOG" 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          HEALTHY=false
          for attempt in {1..30}; do
            if ! kill -0 "$PF_PID" 2>/dev/null; then
              cat "$PF_LOG"
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:18000/health; then
              HEALTHY=true
              break
            fi
            sleep 2
          done
          if [[ "$HEALTHY" != true ]]; then
            echo "::error::Health check failed"
            cat "$PF_LOG"
            exit 1
          fi
          if [[ "$NAMESPACE" == prod ]]; then
            curl --fail --silent --show-error --max-time 10 \
              --retry 5 --retry-delay 2 --retry-all-errors \
              http://127.0.0.1:18000/ready
          fi

      - name: Annotate production deployment
        if: inputs.environment == 'prod'
        run: |
          kubectl annotate "deployment/$DEPLOYMENT_NAME" \
            --namespace "$NAMESPACE" \
            "deployment.kubernetes.io/image-tag=$IMAGE_TAG" \
            deployed-by=github-actions \
            "deployment-time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --overwrite

      - name: Deployment summary
        run: |
          {
            echo '### Deployment completed'
            printf '\n- Environment: `%s`\n' "$NAMESPACE"
            printf -- '- Image: `%s:%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_TAG"
            printf -- '- Cluster: `%s`\n' "$GKE_CLUSTER_NAME"
            printf -- '- Zone: `%s`\n' "$GKE_ZONE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          kubectl get pods --namespace "$NAMESPACE" --request-timeout=15s || true
          kubectl get events --namespace "$NAMESPACE" \
            --sort-by=.metadata.creationTimestamp --request-timeout=15s || true
