name: Push to Registry (CD - Step 1)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., latest, v1.0.0, dev)'
        required: true
        default: 'latest'
        type: string
      image_name:
        description: 'Image name (e.g., ecommerce-api)'
        required: false
        default: ''
        type: string
      registry_url:
        description: 'Registry URL (e.g., gcr.io/my-project, leave empty to use secrets)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker ${{ secrets.GCP_REGISTRY_URL }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=${{ github.event.inputs.image_tag }}
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi

          # Use provided registry_url or fall back to secrets
          if [[ -n "${{ github.event.inputs.registry_url }}" ]]; then
            REGISTRY="${{ github.event.inputs.registry_url }}"
          else
            REGISTRY="${{ secrets.GCP_REGISTRY_URL }}"
          fi

          # Use provided image_name or fall back to secrets
          if [[ -n "${{ github.event.inputs.image_name }}" ]]; then
            IMAGE_NAME="${{ github.event.inputs.image_name }}"
          else
            IMAGE_NAME="${{ secrets.DOCKER_IMAGE_NAME }}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
